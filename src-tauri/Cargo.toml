[package]
name = "opensw"
version = "0.8.0"
description = "opensw: an open-source math editor modelled on Scientific Word 5.5"
authors = ["opensw contributors"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.90"
default-run = "opensw"

[lib]
name = "opensw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
trash = "5"
