[package]
name = "sw-next"
version = "0.1.0"
description = "Scientific Word Next"
authors = ["ckwinlose"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "sw_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
