# Builds opensw for macOS and Linux and puts the installers on the branches
# "sw-next-build-mac" and "sw-next-build-linux" (private repo).
# Only when started by hand (Actions > other-builds > Run workflow): the Windows
# build (windows.yml) is the one used day to day.
name: other-builds
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            branch: sw-next-build-mac
            tectonic: '*aarch64-apple-darwin.tar.gz'
            bundles: dmg
            out: dmg/*.dmg
          - os: ubuntu-22.04
            branch: sw-next-build-linux
            tectonic: '*x86_64-unknown-linux-gnu.tar.gz'
            bundles: deb,appimage
            out: 'deb/*.deb appimage/*.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux libraries Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Bundle the Tectonic TeX engine (used when xelatex is not installed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R tectonic-typesetting/tectonic --pattern '${{ matrix.tectonic }}' -D tectonic-dl
          mkdir -p src-tauri/bin
          tar -xzf tectonic-dl/*.tar.gz -C src-tauri/bin
          ls -la src-tauri/bin
      - name: Build
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"resources":{"bin/tectonic":"bin/tectonic"}}}'
      - name: Publish to its branch
        shell: bash
        run: |
          mkdir out
          cd src-tauri/target/release/bundle && cp ${{ matrix.out }} ../../../../out/ && cd ../../../../out
          shasum -a 256 * > SHA256SUMS.txt
          echo "built from ${GITHUB_SHA} at $(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b ${{ matrix.branch }}
          git -c user.name=github-actions -c user.email=actions@github.com add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "${{ runner.os }} installer for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ${{ matrix.branch }}
