# Builds the Windows installer and the portable zip.
# A tag such as v0.5.0 publishes them as a GitHub release:
#   git tag v0.5.0 && git push origin v0.5.0
# Pushing a commit to the branch "sw-next-release" puts them on the branch "sw-next-build"
# instead (for trying a build before releasing it):
#   git push -f origin sw-next:sw-next-release
name: windows-build
on:
  push:
    tags: ['v*']
    branches: ['sw-next-release']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Bundle the Tectonic TeX engine (used when xelatex is not installed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tectonic@0.17.0 -R tectonic-typesetting/tectonic --pattern '*x86_64-pc-windows-msvc.zip' -D tectonic-dl
          mkdir -p src-tauri/bin
          unzip -o tectonic-dl/*.zip -d src-tauri/bin
          ls -la src-tauri/bin
      # the TeX files opensw's documents need, so typesetting works without the internet
      - name: Fill the TeX cache (src-tauri/texwarm)
        shell: bash
        run: |
          src-tauri/texwarm/build-cache.sh "$PWD/src-tauri/bin/tectonic.exe" "$PWD/src-tauri/texcache"
          du -sh src-tauri/texcache
      # opensw-cli.exe: the editor's commands from a terminal or a script (src-tauri/src/cli.rs);
      # built first so the installer can carry it next to opensw.exe
      - name: Build opensw-cli
        shell: bash
        run: cargo build --release --bin opensw-cli --manifest-path src-tauri/Cargo.toml
      - name: Build installer
        shell: bash
        run: npx tauri build --config '{"bundle":{"resources":{"bin/tectonic.exe":"bin/tectonic.exe","texcache/":"texcache/","target/release/opensw-cli.exe":"opensw-cli.exe"}}}'
      # the portable version: no installing; the program and its files in one folder, zipped
      # (it needs Microsoft Edge WebView2, which Windows 10 and 11 already have)
      - name: Portable zip
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force portable/opensw/bin | Out-Null
          Copy-Item src-tauri/target/release/opensw.exe portable/opensw/opensw.exe
          Copy-Item src-tauri/target/release/opensw-cli.exe portable/opensw/opensw-cli.exe
          Copy-Item -Recurse src-tauri/tex55 portable/opensw/tex55
          Copy-Item src-tauri/bin/tectonic.exe portable/opensw/bin/
          Copy-Item -Recurse src-tauri/texcache portable/opensw/texcache
          New-Item -ItemType Directory -Force portable/opensw/engine | Out-Null
          Copy-Item engine/engines.json, engine/opensw_compute.wl portable/opensw/engine/
          Copy-Item LICENSE portable/opensw/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.txt portable/opensw/
          Set-Content portable/opensw/README.txt "opensw $ver portable: put the whole folder anywhere and run opensw.exe (opensw-cli.exe help: the commands from a terminal).`r`nIt needs Microsoft Edge WebView2 (Windows 10 and 11 have it). Settings and fragments are kept in this computer's user folder.`r`n`r`nopensw $ver 免安裝版：整個資料夾放到任何地方，執行 opensw.exe（opensw-cli.exe help：在終端機下指令）。`r`n需要 Microsoft Edge WebView2（Windows 10、11 都有）。設定和片段存在這台電腦的使用者資料夾。" -Encoding utf8
          Compress-Archive -Path portable/opensw -DestinationPath "portable/opensw_${ver}_x64-portable.zip"
      - name: Publish as a release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src-tauri/target/release/bundle/nsis && sha256sum *.exe ../../../../../portable/*.zip | sed 's#[^ ]*/##' > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "opensw ${GITHUB_REF_NAME#v}" \
            --notes "Windows: opensw_*_x64-setup.exe is the installer, opensw_*_x64-portable.zip the portable version. Windows：安裝檔和免安裝版。" \
            *.exe ../../../../../portable/*.zip SHA256SUMS.txt
      - name: Publish to branch sw-next-build
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: bash
        run: |
          mkdir out && cp src-tauri/target/release/bundle/nsis/*.exe out/ && cp portable/*.zip out/
          cd out
          sha256sum *.exe *.zip > SHA256SUMS.txt
          echo "built from ${GITHUB_SHA} at $(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b sw-next-build
          git -c user.name=github-actions -c user.email=actions@github.com add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Windows installer for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" sw-next-build
